[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ambulants"
version = "0.1.0"
description = "Mise en relation des accueillants (mairies, campings…) et des services ambulants, autour d'une carte"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Propriétaire" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ambulants = "ambulants.cli:main"

[tool.setuptools]
packages = ["ambulants"]

[tool.setuptools.package-data]
# Chaque type de fichier de la page doit être nommé : un motif oublié sort
# du paquet sans bruit, et la page installée rend 404 sur son propre script
# (piège payé quatre fois sur WAY2NAV).
ambulants = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
